[package]
name = "rost_sessionizer"
authors = ["Væñgír"]
version = "0.1.0-alpha"
edition = "2024"
description = "Cli-tool which integrates with tmux to manage sessions based on project folders. It is intended to work well with git worktrees."
repository = "https://github.com/Vaengir-Projects/rost_sessionizer.git"
license = "MIT"
keywords = ["tmux", "sessionizer"]
categories = ["command-line-utilities"]
rust-version = "1.87"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["cargo", "derive"] }
clap_complete = "4.5.54"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
walkdir = "2.5.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
test-strategy = "0.4.5"
